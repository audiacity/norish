name: Mobile-enabled server image (fork)

# Builds the server image from this branch into the fork owner's GHCR, so a
# self-hosted instance can run the MOBILE_APP_ENABLED server change before it
# exists upstream.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Server CPU architecture"
        type: choice
        options: [amd64, arm64]
        default: amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: mobile-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'norish-recipes/norish'
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "report=$(node tooling/monorepo/scripts/print-package-versions.mjs)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ inputs.arch }}
          build-args: |
            NORISH_VERSION_REPORT_JSON=${{ steps.meta.outputs.report }}
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/norish:mobile
          cache-from: type=gha,scope=${{ inputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.arch }}
